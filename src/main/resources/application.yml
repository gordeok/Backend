spring:
  profiles:
    include: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 멀티파트 파일 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

ai:
  server:
    url: http://localhost:8001

# 로컬 파일 업로드 설정
file:
  upload:
    dir: ./uploads          # 서버 실행 위치 기준 상대 경로
    url-prefix: /uploads    # 외부에서 접근할 URL prefix
